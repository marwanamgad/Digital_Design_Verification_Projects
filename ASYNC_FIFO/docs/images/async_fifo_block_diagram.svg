<text x='105.0' y='222.0' font-size='14' fill='#222' text-anchor='middle' font-weight='bold' >wr_ptr</text>
<text x='105.0' y='240.0' font-size='12' fill='#666' text-anchor='middle' font-weight='normal' >4-bit binary reg</text>
