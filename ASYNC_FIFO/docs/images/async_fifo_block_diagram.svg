<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='520' viewBox='0 0 1200 520' font-family='Helvetica, Arial, sans-serif'>
<defs><marker id='aw' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#E07B2E'/></marker><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2F6FC9'/></marker><marker id='ak' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker></defs>
<rect width='1200' height='520' fill='white'/>
<text x='600.0' y='30' font-size='19' fill='#222' text-anchor='middle' font-weight='bold' >ASYNC_FIFO: two clock domains, only Gray-coded pointers cross</text>
<rect x='10' y='50' width='575' height='420' rx='12' fill='#FDF1E7'/>
<rect x='615' y='50' width='575' height='420' rx='12' fill='#EAF1FB'/>
<text x='30' y='76' font-size='15' fill='#E07B2E' text-anchor='start' font-weight='bold' >WRITE DOMAIN  (i_wclk)</text>
<text x='1170' y='76' font-size='15' fill='#2F6FC9' text-anchor='end' font-weight='bold' >READ DOMAIN  (i_rclk)</text>
<line x1='600' y1='50' x2='600' y2='470' stroke='#222' stroke-width='1.5' stroke-dasharray='6 5'/>
<text x='600' y='492' font-size='13' fill='#666' text-anchor='middle' font-weight='normal' >clock-domain boundary</text>
