<text x='600.0' y='122.0' font-size='14' fill='#222' text-anchor='middle' font-weight='bold' >MEM [0:7]</text>
<text x='600.0' y='140.0' font-size='12' fill='#666' text-anchor='middle' font-weight='normal' >dual-port: write @i_wclk, read @i_rclk</text>
<text x='30' y='120' font-size='13' fill='#E07B2E' text-anchor='start' font-weight='bold' >i_wen, i_wdata</text>
<polyline points='140,125 490,125' fill='none' stroke='#E07B2E' stroke-width='1.8'  marker-end='url(#aw)'/>
<text x='300' y='117' font-size='12' fill='#666' text-anchor='middle' font-weight='normal' >write if i_wen &amp;&amp; !o_full, addr = wr_ptr[2:0]</text>
<polyline points='710,125 1000,125' fill='none' stroke='#2F6FC9' stroke-width='1.8'  marker-end='url(#ar)'/>
<text x='855' y='117' font-size='12' fill='#666' text-anchor='middle' font-weight='normal' >read if i_ren &amp;&amp; !o_empty, addr = rd_ptr[2:0]</text>
<text x='1008' y='130' font-size='13' fill='#2F6FC9' text-anchor='start' font-weight='bold' >o_rdata</text>
