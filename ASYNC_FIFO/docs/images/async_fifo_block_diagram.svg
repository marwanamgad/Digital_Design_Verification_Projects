<text x='285.0' y='222.0' font-size='14' fill='#222' text-anchor='middle' font-weight='bold' >Binary2Gray</text>
<text x='285.0' y='240.0' font-size='12' fill='#666' text-anchor='middle' font-weight='normal' >WR_B2G</text>
<rect x='625' y='200' width='150' height='50' rx='8' fill='white' stroke='#2F6FC9' stroke-width='1.6'/>
