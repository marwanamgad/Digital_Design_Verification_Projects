<text x='885' y='353' font-size='12' fill='#222' text-anchor='middle' font-weight='normal' >cb_driver_wr   (#1)</text>
<text x='885' y='373' font-size='12' fill='#222' text-anchor='middle' font-weight='normal' >cb_monitor_wr  (#1step)</text>
