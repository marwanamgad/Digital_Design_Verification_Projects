<rect x='785' y='530' width='380' height='170' rx='10' fill='white' stroke='#666' stroke-dasharray='5 4'/>
<text x='800' y='556' font-size='12.5' fill='#222' text-anchor='start' font-weight='bold' >How the interface reaches the classes:</text>
<text x='800' y='581' font-size='12.5' fill='#222' text-anchor='start' font-weight='normal' >1. top: config_db set(virtual FIFO_if, "FIFO_IF")</text>
<text x='800' y='606' font-size='12.5' fill='#222' text-anchor='start' font-weight='normal' >2. test: get it, store in FIFO_config.FIFO_vif</text>
<text x='800' y='631' font-size='12.5' fill='#222' text-anchor='start' font-weight='normal' >3. test: config_db set(FIFO_config, "CFG")</text>
<text x='800' y='656' font-size='12.5' fill='#222' text-anchor='start' font-weight='normal' >4. agent: get CFG, hand vif to drv and mon</text>
<text x='800' y='681' font-size='12.5' fill='#222' text-anchor='start' font-weight='normal' >5. top: run_test()  +UVM_TESTNAME=FIFO_test</text>
